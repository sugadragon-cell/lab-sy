<style>
/* Layout: one narrow column like a phone form; progress = a row of numbered phone-storage slots that fill as steps finish. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6774; --line:#cfd6de;

  --good:#2e7d4f; --warn:#a3532a;

  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --ink:#e7ecf1; --muted:#9aa6b3; --line:#2d3743;
  --slot:#26303b; --accent:#6aaedb; --accent-ink:#0b1620; --label:#e6b843; --label-ink:#231b03;
  --good:#6cc493; --warn:#e08c62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e7ecf1; --muted:#9aa6b3; --line:#2d3743;
  --slot:#26303b; --accent:#6aaedb; --accent-ink:#0b1620; --label:#e6b843; --label-ink:#231b03;
  --good:#6cc493; --warn:#e08c62; color-scheme:dark}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.tag{background:var(--label);color:var(--label-ink);font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:4px;letter-spacing:.04em}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{height:26px;border-radius:5px;background:var(--slot);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);transition:background .25s}
.slot.done{background:var(--accent);color:var(--accent-ink)}
.slot.now{outline:2px solid var(--accent);outline-offset:-2px;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:30px} h2{font-size:24px}
p{margin:0} .muted{color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:500 16px var(--f-body);padding:14px 18px;cursor:pointer;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.scale{display:grid;gap:6px}
.scale.s6{grid-template-columns:repeat(6,1fr)} .scale.s7{grid-template-columns:repeat(7,1fr)}
.opt{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px 6px;font:500 16px var(--f-mono);cursor:pointer;min-width:0}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:12px}
.ends.mid{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .opt{font-family:var(--f-body);text-align:left;padding:14px;line-height:1.5}
.q{font-size:18px;font-weight:500}
input[type=number],textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:16px var(--f-body)}
textarea{font-family:var(--f-mono);font-size:12px;min-height:90px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:10px 8px;text-align:center;font-size:15px}
th{background:var(--bg);font-weight:500}
td.num{font-family:var(--f-mono);font-size:18px}
.note{border-left:3px solid var(--label);padding:10px 12px;background:var(--bg);font-size:14px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:8px}

.sf{background:var(--sf-bg);color:var(--sf-ink);border-radius:16px;aspect-ratio:9/13;width:min(340px,100%);max-width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px;box-sizing:border-box}
.sf .handle{font-size:13px;color:var(--sf-sub);display:flex;gap:8px;align-items:center}
.sf .dot{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f2c14e,#d9572b);flex:none}
.sf .claim{font-family:var(--f-display);font-size:30px;line-height:1.25;text-wrap:balance}
.sf .claim b{color:var(--sf-hi);font-weight:400}
.sf .meta{display:flex;gap:16px;font-size:13px;color:var(--sf-sub);font-family:var(--f-mono)}
.article{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--bg)}
.article .src{font-size:13px;color:var(--muted)}
.article h3{margin:0;font-size:18px;line-height:1.4}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.small{font-size:13px}
.head-list{display:flex;flex-direction:column;gap:8px}
.head-list .opt{font-family:var(--f-body);text-align:left;padding:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.head-list .mark{font-family:var(--f-mono);font-size:13px;border:1px solid currentColor;border-radius:4px;min-width:22px;text-align:center;flex:none}
.admin td,.admin th{font-size:13px;padding:6px}
.hyp{display:flex;flex-direction:column;gap:8px}
.hyp .lab{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const rnd = () => Math.random() < .5;
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const makePid = () => "P" + Date.now().toString(36).slice(-5).toUpperCase() + Math.floor(Math.random()*1296).toString(36).toUpperCase().padStart(2,"0");
let pid;

// 표: 주제 종류마다 숫자 세트를 섞고, '처치가 더 나은' 버전 2개·'더 나쁜' 버전 2개
function buildTables(){
  const out=[];
  ["neutral","phone"].forEach(kind=>{
    const topics=TOPICS.filter(t=>t.kind===kind), sets=shuffle([0,1,2,3]), dirs=shuffle([true,true,false,false]);
    topics.forEach((t,i)=>out.push({id:t.id, kind, set:sets[i], better:dirs[i]}));
  });
  return shuffle(out);
}
// 근거: 결론(찬/반) 안에서 두 출처가 2개씩 맡도록
function buildEvidence(){
  const out=[];
  ["pro","con"].forEach(side=>{
    const src=shuffle(["teacher","teacher","student","student"]);
    EVIDENCE.filter(e=>e.side===side).forEach((e,i)=>out.push({id:e.id, source:src[i]}));
  });
  return shuffle(out);
}

const $app = document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function on(sel, fn){ $app.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b)); }

function drawSlots(){

function scale(name,n,value,ends,mid){

    <div class="ends${mid?" mid":""}"><span>${ends[0]}</span><span>${ends[1]}</span></div>`;
}
function lap(key){ S.r.ms[key]=(S.r.ms[key]||0)+(Date.now()-S.shown); S.shown=Date.now(); }
function next(key){ lap(key||STEPS[S.step]); S.step++; render(); toTop(); }

  byId("nx").onclick=()=>{ lap("e_"+item.id);

/* ==================================================================
   점수 계산 — 가설별 지표
   ================================================================== */
function mean(a){ const v=a.filter(x=>x!=null&&!isNaN(x)); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; }
function finalize(){
  const r=S.r; r.finishedAt=new Date().toISOString();
  r.msTotal=Object.values(r.ms).reduce((s,v)=>s+v,0);
  r.attnPass = r.attn===ATTN.answer;
  r.cfsScore = r.cfs.reduce((s,v,i)=>s+(CFS[i].r?7-v:v),0);               // 12~72
  r.crtCorrect = CRT.map(q=>String(r.crt[q.id]).trim()===String(q.answer));
  r.crtIntuitive = CRT.map(q=>String(r.crt[q.id]).trim()===String(q.intuitive));
  r.crtScore = r.crtCorrect.filter(Boolean).length;                        // 0~3
  const cong = r.headPicks.filter(id=>HEADLINES.find(h=>h.id===id).side===r.side).length;
  const T=r.tables, E=r.evidence, acc=a=>mean(a.map(x=>x.correct?1:0));
  r.idx = {
    selective: (cong-(PICKS-cong))/PICKS,                                   // H 선택적 노출: −1~+1
    neutralAcc: acc(T.filter(t=>t.kind==="neutral")),                       // H1: 0~1
    phoneCongAcc: acc(T.filter(t=>t.kind==="phone"&&t.congruent)),
    phoneIncongAcc: acc(T.filter(t=>t.kind==="phone"&&!t.congruent)),
    evCF: mean(E.filter(e=>e.congruent&&e.friendly).map(e=>e.rating)),
    evCU: mean(E.filter(e=>e.congruent&&!e.friendly).map(e=>e.rating)),
    evIF: mean(E.filter(e=>!e.congruent&&e.friendly).map(e=>e.rating)),
    evIU: mean(E.filter(e=>!e.congruent&&!e.friendly).map(e=>e.rating))
  };
  const x=r.idx;
  x.motivatedGap = x.phoneCongAcc - x.phoneIncongAcc;                       // H2: −1~+1
  x.ratingAsym = mean(E.filter(e=>e.congruent).map(e=>e.rating)) - mean(E.filter(e=>!e.congruent).map(e=>e.rating)); // H3
  x.sourceEff  = mean(E.filter(e=>e.friendly).map(e=>e.rating))  - mean(E.filter(e=>!e.friendly).map(e=>e.rating));  // H4
}

function decode(s){ return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); }

let saveState="saving";
function setSave(s){ saveState=s; drawSaveBox(); }

// 저장 실패분은 이 기기에 잠시 보관했다가 다음 저장 때 다시 보낸다
// 파일로 열었을 때(claude.ai 밖): 이 컴퓨터의 크롬 저장공간에 응답을 쌓는다
const LKEY="phoneLabLocalResponses";
const LOCAL_OK=(()=>{ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();
function localAll(){ try{ return JSON.parse(localStorage.getItem(LKEY)||"[]"); }catch(e){ return []; } }
function localAdd(r){ try{ const a=localAll().filter(x=>x.pid!==r.pid); a.push(r); localStorage.setItem(LKEY,JSON.stringify(a)); return true; }catch(e){ return false; } }

const QKEY="phoneLabPending";
function qRead(){ try{ return JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return []; } }
function qWrite(a){ try{ localStorage.setItem(QKEY,JSON.stringify(a)); }catch(e){} }
async function putDoc(r){ await DB.collection("responses").doc("r_"+r.pid).set({...r,savedVia:"db"}); }
async function flushQueue(){
  const q=qRead(); if(!q.length||!DB) return;
  const left=[]; for(const r of q){ try{ await putDoc(r); }catch(e){ left.push(r); } }
  qWrite(left);
}

async function save(){
  if(ON_GAS){
    const f=flatten(S.r,true);
    google.script.run.withSuccessHandler(()=>setSave("saved")).withFailureHandler(()=>setSave("code")).saveResponse({cols:f.cols,row:f.row});
    return;
  }
  await capReady;
  const r=S.r;
  if(DB){
    try{ await putDoc(r); setSave("saved"); flushQueue(); return; }
    catch(e){ qWrite([...qRead(),r]); }
  } else if(localAdd({...r,savedVia:"local"})) return setSave("local");
  setSave("code");
}

    <p class="muted small">아직 참여하지 않은 친구에게 실험 내용을 말하지 말아 주세요. 결과가 달라질 수 있어요.</p>
    <button class="btn" id="nextP">다음 참가자 시작</button>

function drawSaveBox(){
  const box=byId("saveBox"); if(!box) return;
  if(saveState==="saving"){ box.textContent="응답을 저장하는 중이에요…"; return; }
  if(saveState==="local"){ box.innerHTML=`<span>응답이 이 컴퓨터에 저장됐어요. 참가 번호 <b style="font-family:var(--f-mono)">${pid}</b></span>`; return; }
  if(saveState==="saved"){ box.innerHTML=`<span>응답이 저장됐어요. 참가 번호 <b style="font-family:var(--f-mono)">${pid}</b></span>`; return; }
  const code=encode(S.r);
  box.innerHTML=`<span><b>자동 저장이 되지 않았어요.</b> 아래 응답 코드를 복사해서 연구자에게 보내 주세요.</span>
    <textarea id="code" readonly>${code}</textarea>
    <button class="btn" id="copy">응답 코드 복사</button>`;
  byId("copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(code); byId("copy").textContent="복사됐어요"; }
    catch(e){ const t=byId("code"); t.focus(); t.select(); byId("copy").textContent="선택됐어요. 길게 눌러 복사하세요"; } };
}

/* ==================================================================
   데이터 한 줄로 펼치기 (구글 시트 / CSV 공통 열)
   ================================================================== */
const TID=TOPICS.map(t=>t.id), EID=EVIDENCE.map(e=>e.id);
function flatten(r,withCode){
  const x=r.idx, tb=Object.fromEntries(r.tables.map(t=>[t.id,t])), ev=Object.fromEntries(r.evidence.map(e=>[e.id,e]));
  const row={
    pid:r.pid, savedVia:r.savedVia||"", startedAt:r.startedAt, finishedAt:r.finishedAt, minutes:+(r.msTotal/60000).toFixed(1),
    format:r.format, stance:r.stance, side:r.side, importance:r.importance, attnPass:r.attnPass,
    cfsScore:r.cfsScore, crtScore:r.crtScore, crtIntuitive:r.crtIntuitive.filter(Boolean).length,
    selective:x.selective, neutralAcc:x.neutralAcc, phoneCongAcc:x.phoneCongAcc, phoneIncongAcc:x.phoneIncongAcc, motivatedGap:x.motivatedGap,
    ratingAsym:x.ratingAsym, sourceEff:x.sourceEff, evCongFriendly:x.evCF, evCongUnfriendly:x.evCU, evIncongFriendly:x.evIF, evIncongUnfriendly:x.evIU
  };
  r.cfs.forEach((v,i)=>row["cfs"+(i+1)]=v);
  CRT.forEach(q=>row[q.id]=r.crt[q.id]);
  r.headPicks.forEach((id,i)=>row["head"+(i+1)]=id);
  TID.forEach(id=>{const t=tb[id]; row[id+"_better"]=t.better; row[id+"_correct"]=t.correct; row[id+"_sec"]=Math.round((r.ms["t_"+id]||0)/1000);});
  EID.forEach(id=>{const e=ev[id]; row[id+"_rating"]=e.rating; row[id+"_source"]=e.source; row[id+"_sec"]=Math.round((r.ms["e_"+id]||0)/1000);});
  if(withCode) row.code=encode(r);
  const cols=Object.keys(row);
  return {cols, row:cols.map(c=>row[c]==null?"":row[c])};
}

const fmt=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toFixed(d);
function cell(group,key,d){ const v=group.map(r=>r.idx[key]).filter(x=>x!=null&&!isNaN(x)); return v.length? `${fmt(mean(v),d)} <span class="muted">(${v.length})</span>` : "–"; }

function drawAdmin(){
  const all=ROWS, R=all.filter(r=>r.attnPass);
  const med=(()=>{const s=R.map(r=>r.cfsScore).sort((a,b)=>a-b); return s.length?s[Math.floor(s.length/2)]:0;})();
  const groups=[
    ["반성적 사고 2~3점", R.filter(r=>r.crtScore>=2)],
    ["반성적 사고 0~1점", R.filter(r=>r.crtScore<2)],
    [`유연성 ${med}점 이상`, R.filter(r=>r.cfsScore>=med)],
    [`유연성 ${med}점 미만`, R.filter(r=>r.cfsScore<med)]
  ];
  const fm=[["숏폼",R.filter(r=>r.format==="short")],["텍스트",R.filter(r=>r.format==="text")]];
  $app.innerHTML=`<section class="card admin">
    <span class="eyebrow">연구자 화면</span>
    <h2>분석 대상 ${R.length}명</h2>

      <div><span>전체 응답</span><b>${all.length}</b></div>

      <div><span>숏폼 / 텍스트</span><b>${fm[0][1].length} / ${fm[1][1].length}</b></div>
      <div><span>찬성 / 반대</span><b>${R.filter(r=>r.side==="pro").length} / ${R.filter(r=>r.side==="con").length}</b></div>
    </div>

    <div class="hyp"><span class="lab">H1 · H2 · 표 해석 정답률 (0~1, 괄호는 인원)</span>
    <div class="tbl-wrap"><table>
      <thead><tr><th>집단</th><th>중립 주제</th><th>휴대폰·일치</th><th>휴대폰·불일치</th><th>격차(일치−불일치)</th></tr></thead>
      <tbody>${groups.map(([n,g])=>`<tr><th>${n}</th><td>${cell(g,"neutralAcc")}</td><td>${cell(g,"phoneCongAcc")}</td><td>${cell(g,"phoneIncongAcc")}</td><td>${cell(g,"motivatedGap")}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="muted small">H1: 중립 주제에서는 반성적 사고·유연성이 높을수록 정답률이 높을 것. H2: 휴대폰 주제의 격차는 반성적 사고가 높은 집단에서 오히려 더 클 것.</p></div>

    <div class="hyp"><span class="lab">H3 · 매체 형식별 편향 (7점 척도 차이, 0이면 편향 없음)</span>
    <div class="tbl-wrap"><table>
      <thead><tr><th>형식</th><th>평가 비대칭</th><th>출처 효과</th><th>선택 편향 (−1~+1)</th></tr></thead>
      <tbody>${fm.map(([n,g])=>`<tr><th>${n}</th><td>${cell(g,"ratingAsym")}</td><td>${cell(g,"sourceEff")}</td><td>${cell(g,"selective")}</td></tr>`).join("")}
      ${fm.flatMap(([n,g])=>[[`${n}·유연성 높음`,g.filter(r=>r.cfsScore>=med)],[`${n}·유연성 낮음`,g.filter(r=>r.cfsScore<med)]]).map(([n,g])=>`<tr><th>${n}</th><td>${cell(g,"ratingAsym")}</td><td>${cell(g,"sourceEff")}</td><td>${cell(g,"selective")}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="muted small">H3: 숏폼 조건에서 평가 비대칭이 더 크고, 유연성이 높아도 그 차이가 줄지 않을 것.</p></div>

    <div class="hyp"><span class="lab">H4 · 결론 × 출처 평균 신뢰도 (1~7)</span>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th>우호 출처</th><th>비우호 출처</th></tr></thead>
      <tbody>
        <tr><th>내 입장과 같은 결론</th><td>${cell(R,"evCF")}</td><td>${cell(R,"evCU")}</td></tr>
        <tr><th>내 입장과 다른 결론</th><td>${cell(R,"evIF")}</td><td>${cell(R,"evIU")}</td></tr>
